services:
  whisp:
    build:
      context: .
      args:
        GIT_COMMIT: ${WHISP_GIT_COMMIT:-unknown}
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      WHISP_DB_PATH: /data/whisp.db
      WHISP_CREDENTIALS_DIR: /credentials
      WHISP_ASSISTANT_PROFILE_PATH: /config/assistant.toml
    volumes:
      - ./data:/data
      - ./credentials:/credentials:ro
      - ./config:/config:ro
    ports:
      # The API is operational/admin-only. Keep it off the public internet and
      # inspect it over SSH with: ssh -L 8080:127.0.0.1:8080 <host>
      - "127.0.0.1:8080:8080"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
