<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head %}{% endblock %}
  <title>{% block title %}Whisp{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --border: #e3e6eb; --text: #1b1f24;
      --muted: #667085; --ok: #12805c; --ok-bg: #e6f6ef; --bad: #c0362c; --bad-bg: #fdecea;
      --warn: #a15c00; --warn-bg: #fff4e0; --info: #3056d3; --info-bg: #eaf0ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216; --panel: #171b21; --border: #2a3039; --text: #e6e9ee;
        --muted: #8b95a5; --ok: #4cc38a; --ok-bg: #143324; --bad: #ff7b72; --bad-bg: #3a1a18;
        --warn: #f0b429; --warn-bg: #3a2c0c; --info: #7fa2ff; --info-bg: #1a2442;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
    h1 { font-size: 22px; margin: 0; }
    h2 { font-size: 15px; margin: 32px 0 12px; }
    .muted { color: var(--muted); }
    code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; min-width: 0;
    }
    .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .value { font-size: 20px; font-weight: 600; margin-top: 4px; }
    .detail { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px;
      font-weight: 600; white-space: nowrap;
    }
    .ok { color: var(--ok); background: var(--ok-bg); }
    .bad { color: var(--bad); background: var(--bad-bg); }
    .notified { color: var(--ok); background: var(--ok-bg); }
    .digest-pending { color: var(--warn); background: var(--warn-bg); }
    .digest-sent { color: var(--info); background: var(--info-bg); }
    .table-wrap {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.when { white-space: nowrap; color: var(--muted); }
    td.text { max-width: 420px; overflow-wrap: anywhere; }
    .empty { padding: 16px; color: var(--muted); }
    header form { margin-left: auto; }
    button {
      font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      padding: 6px 12px;
    }
    .login { max-width: 360px; margin: 12vh auto 0; }
    .login h1 { margin-bottom: 16px; }
    .login label { display: block; font-weight: 600; margin: 12px 0 4px; }
    .login input {
      width: 100%; font: inherit; padding: 9px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }
    .login button {
      width: 100%; margin-top: 18px; padding: 10px; background: var(--info);
      border-color: var(--info); color: var(--panel);
    }
    .error { color: var(--bad); background: var(--bad-bg); border-radius: 8px; padding: 8px 10px; }
  </style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
